[package]
name = "sslab-execution-stack"
version = "0.1.0"
authors = ["Donghyeon Ryu <donghyeonryu@postech.ac.kr>"]
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Tusk consensus + CHASE CDS execution + RocksDB persistence integration"

[dependencies]
async-trait.workspace = true
bincode.workspace = true
ethers-core = { version = "^2.0.0" }
evm.workspace = true
fastcrypto.workspace = true
parking_lot.workspace = true
prometheus.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

narwhal-executor.workspace = true
narwhal-types.workspace = true
sslab-execution.workspace = true
sslab-execution-chase.workspace = true
typed-store.workspace = true
tempfile.workspace = true

[dev-dependencies]
bytes.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
ethers-providers = { version = "^2.0.0" }
prometheus.workspace = true
narwhal-consensus.workspace = true
narwhal-storage.workspace = true
narwhal-test-utils.workspace = true
narwhal-types.workspace = true
